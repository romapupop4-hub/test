version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: ui-gallery-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-ui_gallery}
      MYSQL_USER: ${DB_USER:-galleryuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gallerypass}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ui-gallery-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${SERVER_PORT:-5000}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ui_gallery}
      DB_USER: ${DB_USER:-galleryuser}
      DB_PASSWORD: ${DB_PASSWORD:-gallerypass}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
    ports:
      - "5000:5000"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ui-gallery-client
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mariadb_data:
